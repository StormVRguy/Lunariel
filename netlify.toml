[build]
  command = "npm ci && npm run build --workspace=apps/web"
  publish = "apps/web/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["packages/intercession-handler/**", "packages/lunariel-core/**"]

[functions.intercession]
  timeout = 26

[[redirects]]
  from = "/api/intercession"
  to = "/.netlify/functions/intercession"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
