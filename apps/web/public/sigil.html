<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lunariel — Evocation Sigil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --lu-bg: #16161d;
        --lu-text-primary: #f6f4ff;
        --lu-text-secondary: #c8c8e8;
        --lu-accent-light: #c8d8ff;
        --lu-border-strong: rgba(170, 188, 245, 0.72);
        --lu-halo: rgba(180, 200, 255, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem 1.5rem 3rem;
        background: var(--lu-bg);
        color: var(--lu-text-primary);
        font-family: "IM Fell English", Georgia, serif;
      }
      h1 {
        font-family: Cinzel, serif;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--lu-accent-light);
        margin: 0;
        text-align: center;
      }
      .figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .sigilImage {
        display: block;
        max-width: min(100%, 1080px);
        width: auto;
        height: auto;
        border-radius: 50%;
        border: 1px solid var(--lu-border-strong);
        box-shadow: 0 0 40px var(--lu-halo);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
      }
      .btn {
        font-family: Cinzel, serif;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--lu-accent-light);
        border: 1px solid var(--lu-border-strong);
        border-radius: 999px;
        padding: 0.65rem 1.25rem;
        transition: background 0.2s, color 0.2s;
      }
      .btn:hover {
        background: rgba(158, 180, 232, 0.2);
        color: var(--lu-text-primary);
      }
      .btnPrimary {
        background: rgba(158, 180, 232, 0.15);
      }
      .meta {
        font-size: 0.8rem;
        color: var(--lu-text-secondary);
        margin: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Lunariel — Evocation Sigil</h1>
    <figure class="figure">
      <img
        class="sigilImage"
        src="/lunariel-sigil.png"
        width="1080"
        height="1080"
        alt="Lunariel evocation sigil at full resolution"
      />
    </figure>
    <div class="actions">
      <a
        class="btn btnPrimary"
        href="/lunariel-sigil.png"
        download="lunariel-sigil.png"
      >
        Download sigil
      </a>
      <a class="btn" href="/">Return to the chapel</a>
    </div>
    <p class="meta">1080 × 1080 PNG — original resolution</p>
  </body>
</html>
